name: Stats

on:
  # Раз в 6 часов. Минуты смещены: ровно в :00 GitHub задерживает запуски в часы пик.
  schedule:
    - cron: "37 */6 * * *"
  # Кнопка "Run workflow" во вкладке Actions — обновить прямо сейчас.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Свой генератор: только публичный REST API и стандартная библиотека.
      # Сторонних экшенов и PAT не нужно.
      - name: Сгенерировать карточку
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py out/stats.svg

      # Ветка assets пересоздаётся с нуля и force-push'ится, поэтому на ней
      # ВСЕГДА ровно один коммит. История не накапливается, репа не пухнет.
      - name: Опубликовать на ветку assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh out/

          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp out/*.svg /tmp/pub/

          cd /tmp/pub
          git init -q -b assets
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "stats: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" assets

          echo "Опубликовано:"
          git log --oneline

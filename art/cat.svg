<svg xmlns="http://www.w3.org/2000/svg" width="480" height="110" viewBox="0 0 480 110" role="img" aria-label="Пиксельный котик катит клубок">
  <style>
    .leg { opacity: 0; }
    .leg0 { animation: f0 .6s steps(1) infinite; }
    .leg1 { animation: f1 .6s steps(1) infinite; }
    .leg2 { animation: f2 .6s steps(1) infinite; }
    .leg3 { animation: f3 .6s steps(1) infinite; }
    @keyframes f0 { 0%,24.99% {opacity:1} 25%,100% {opacity:0} }
    @keyframes f1 { 0%,24.99% {opacity:0} 25%,49.99% {opacity:1} 50%,100% {opacity:0} }
    @keyframes f2 { 0%,49.99% {opacity:0} 50%,74.99% {opacity:1} 75%,100% {opacity:0} }
    @keyframes f3 { 0%,74.99% {opacity:0} 75%,100% {opacity:1} }

    /* проход через весь холст */
    .walker { animation: walk 9s linear infinite; }
    @keyframes walk {
      from { transform: translateX(-130px); }
      to   { transform: translateX(520px); }
    }
    /* лёгкое покачивание в такт шагам */
    .bob { animation: bob .6s ease-in-out infinite; }
    @keyframes bob { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-2px)} }

    .yarn { animation: roll .6s linear infinite; transform-origin: 11px 11px; }
    @keyframes roll { from {transform:rotate(0)} to {transform:rotate(360deg)} }

    .ground { stroke: #808080; stroke-opacity: .35; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 8; }
  </style>

  <line class="ground" x1="8" y1="71" x2="472" y2="71"/>

  <g class="walker">
    <g class="bob">
      <!-- корпус -->
      <rect x="10" y="5" width="10" height="5" fill="#2f2418"/>
      <rect x="5" y="10" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="10" width="10" height="5" fill="#f0883e"/>
      <rect x="20" y="10" width="5" height="5" fill="#2f2418"/>
      <rect x="5" y="15" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="15" width="10" height="5" fill="#f0883e"/>
      <rect x="20" y="15" width="5" height="5" fill="#2f2418"/>
      <rect x="70" y="15" width="5" height="5" fill="#2f2418"/>
      <rect x="95" y="15" width="5" height="5" fill="#2f2418"/>
      <rect x="5" y="20" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="20" width="10" height="5" fill="#f0883e"/>
      <rect x="20" y="20" width="5" height="5" fill="#2f2418"/>
      <rect x="65" y="20" width="5" height="5" fill="#2f2418"/>
      <rect x="70" y="20" width="5" height="5" fill="#f0883e"/>
      <rect x="75" y="20" width="5" height="5" fill="#2f2418"/>
      <rect x="90" y="20" width="5" height="5" fill="#2f2418"/>
      <rect x="95" y="20" width="5" height="5" fill="#f0883e"/>
      <rect x="100" y="20" width="5" height="5" fill="#2f2418"/>
      <rect x="5" y="25" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="25" width="10" height="5" fill="#f0883e"/>
      <rect x="20" y="25" width="5" height="5" fill="#2f2418"/>
      <rect x="60" y="25" width="5" height="5" fill="#2f2418"/>
      <rect x="65" y="25" width="15" height="5" fill="#f0883e"/>
      <rect x="80" y="25" width="10" height="5" fill="#2f2418"/>
      <rect x="90" y="25" width="15" height="5" fill="#f0883e"/>
      <rect x="105" y="25" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="30" width="5" height="5" fill="#2f2418"/>
      <rect x="15" y="30" width="5" height="5" fill="#f0883e"/>
      <rect x="20" y="30" width="5" height="5" fill="#2f2418"/>
      <rect x="55" y="30" width="5" height="5" fill="#2f2418"/>
      <rect x="60" y="30" width="45" height="5" fill="#f0883e"/>
      <rect x="105" y="30" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="35" width="5" height="5" fill="#2f2418"/>
      <rect x="15" y="35" width="5" height="5" fill="#f0883e"/>
      <rect x="20" y="35" width="35" height="5" fill="#2f2418"/>
      <rect x="55" y="35" width="20" height="5" fill="#f0883e"/>
      <rect x="75" y="35" width="5" height="5" fill="#1b140d"/>
      <rect x="80" y="35" width="25" height="5" fill="#f0883e"/>
      <rect x="105" y="35" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="40" width="5" height="5" fill="#2f2418"/>
      <rect x="15" y="40" width="85" height="5" fill="#f0883e"/>
      <rect x="100" y="40" width="5" height="5" fill="#ff9db1"/>
      <rect x="105" y="40" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="45" width="5" height="5" fill="#2f2418"/>
      <rect x="15" y="45" width="85" height="5" fill="#ffd9b0"/>
      <rect x="100" y="45" width="10" height="5" fill="#2f2418"/>
      <rect x="15" y="50" width="90" height="5" fill="#2f2418"/>
    <g class="leg leg0">
      <rect x="20" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="40" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="65" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="85" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="15" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="40" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="60" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="85" y="60" width="10" height="5" fill="#2f2418"/>
    </g>
    <g class="leg leg1">
      <rect x="25" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="35" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="70" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="80" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="20" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="35" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="65" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="80" y="60" width="10" height="5" fill="#2f2418"/>
    </g>
    <g class="leg leg2">
      <rect x="15" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="40" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="60" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="85" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="10" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="40" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="55" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="85" y="60" width="10" height="5" fill="#2f2418"/>
    </g>
    <g class="leg leg3">
      <rect x="25" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="35" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="70" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="80" y="55" width="5" height="5" fill="#2f2418"/>
      <rect x="20" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="35" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="65" y="60" width="10" height="5" fill="#2f2418"/>
      <rect x="80" y="60" width="10" height="5" fill="#2f2418"/>
    </g>
    </g>

    <!-- клубок катится впереди -->
    <g transform="translate(124, 45)">
      <g class="yarn">
        <circle cx="11" cy="11" r="10" fill="#8ecae6" stroke="#2f2418" stroke-width="2"/>
        <path d="M4 8 q7 4 14 -1 M3 13 q8 5 16 -2 M7 19 q5 -6 12 -8"
              fill="none" stroke="#2f2418" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="130" viewBox="0 0 480 130" shape-rendering="crispEdges" role="img" aria-label="Tequila, a tabby pixel cat, walking and rolling a ball of yarn">
  <style>
    .walker { animation: walk 12s linear infinite; }
    @keyframes walk {
      from { transform: translateX(-176px); }
      to   { transform: translateX(510px); }
    }

    /* покачивание в такт шагам */
    .bob { animation: bob .6s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }

    @keyframes lg0 { 0.00%,24.99%{opacity:1}25.00%,100%{opacity:0} }
    .lg0 { animation: lg0 .6s steps(1) infinite; }
    @keyframes lg1 { 0%,24.99%{opacity:0}25.00%,49.99%{opacity:1}50.00%,100%{opacity:0} }
    .lg1 { animation: lg1 .6s steps(1) infinite; }
    @keyframes lg2 { 0%,49.99%{opacity:0}50.00%,74.99%{opacity:1}75.00%,100%{opacity:0} }
    .lg2 { animation: lg2 .6s steps(1) infinite; }
    @keyframes lg3 { 0%,74.99%{opacity:0}75.00%,99.99%{opacity:1} }
    .lg3 { animation: lg3 .6s steps(1) infinite; }
    @keyframes tl0 { 0.00%,24.99%{opacity:1}25.00%,100%{opacity:0} }
    .tl0 { animation: tl0 1.4s steps(1) infinite; }
    @keyframes tl1 { 0%,24.99%{opacity:0}25.00%,49.99%{opacity:1}50.00%,100%{opacity:0} }
    .tl1 { animation: tl1 1.4s steps(1) infinite; }
    @keyframes tl2 { 0%,49.99%{opacity:0}50.00%,74.99%{opacity:1}75.00%,100%{opacity:0} }
    .tl2 { animation: tl2 1.4s steps(1) infinite; }
    @keyframes tl3 { 0%,74.99%{opacity:0}75.00%,99.99%{opacity:1} }
    .tl3 { animation: tl3 1.4s steps(1) infinite; }

    /* моргает изредка */
    .blink { opacity: 0; animation: blink 5s steps(1) infinite; }
    @keyframes blink { 0%,96%{opacity:0} 96.5%,98.5%{opacity:1} 99%,100%{opacity:0} }

    /* клубок кувыркается шагами по 90°, чтобы пиксели остались на сетке */
    .ball { transform-box: fill-box; transform-origin: center;
            animation: tumble .8s steps(4) infinite; }
    @keyframes tumble { from{transform:rotate(0)} to{transform:rotate(360deg)} }

    .ground { stroke:#808080; stroke-opacity:.35; stroke-width:2;
              stroke-linecap:round; stroke-dasharray:6 8; }
  </style>

  <line class="ground" x1="8" y1="84" x2="472" y2="84"/>

  <g class="walker">
    <g class="bob">
      <g>
        <rect x="72" y="6" width="6" height="6" fill="#33260f"/>
